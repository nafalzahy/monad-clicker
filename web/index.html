<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monad Clicker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #14101f;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
    }
    h1 { margin-bottom: 4px; }
    .sub { color: #a79bd6; margin-bottom: 24px; }
    button {
      border: 0;
      border-radius: 12px;
      background: #836ef9;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      padding: 12px 24px;
    }
    button:hover:not(:disabled) { background: #6f58f0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #clickBtn { font-size: 32px; padding: 32px 64px; margin: 28px 0; }
    .card {
      background: #1f1933;
      border-radius: 14px;
      max-width: 420px;
      margin: 10px auto;
      padding: 14px 18px;
      text-align: left;
      display: flex;
      justify-content: space-between;
    }
    .card b { color: #c9bfff; }
    #status { margin-top: 18px; min-height: 24px; color: #a79bd6; }
    a { color: #c9bfff; }
  </style>
</head>
<body>
  <h1>🟣 Monad Clicker</h1>
  <div class="sub">Game klik on-chain di Monad Testnet</div>

  <button id="connectBtn">Connect Wallet</button>
  <div id="account" class="sub" style="margin-top:12px"></div>

  <button id="clickBtn" disabled>KLIK!</button>

  <div class="card"><span>Skor kamu</span><b id="myScore">0</b></div>
  <div class="card"><span>Total klik semua pemain</span><b id="total">0</b></div>
  <div class="card"><span>Pemain teratas</span><b id="top">-</b></div>

  <div id="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script>
    const CONTRACT_ADDRESS = "0x3bF03Dcec013f01D7e56be5470f2C6442381cCdd";

    const ABI = [
      "function click()",
      "function score(address) view returns (uint256)",
      "function topPlayer() view returns (address)",
      "function topScore() view returns (uint256)",
      "function totalClicks() view returns (uint256)"
    ];

    const MONAD_TESTNET = {
      chainId: "0x279F", // 10143
      chainName: "Monad Testnet",
      nativeCurrency: { name: "Monad", symbol: "MON", decimals: 18 },
      rpcUrls: ["https://testnet-rpc.monad.xyz"],
      blockExplorerUrls: ["https://testnet.monadvision.com"]
    };

    let signer, contract, userAddress;
    const $ = (id) => document.getElementById(id);
    const short = (a) => a.slice(0, 6) + "..." + a.slice(-4);

    async function switchToMonad() {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: MONAD_TESTNET.chainId }]
        });
      } catch (err) {
        if (err.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [MONAD_TESTNET]
          });
        } else {
          throw err;
        }
      }
    }

    async function connect() {
      try {
        if (!window.ethereum) {
          alert("Wallet tidak terdeteksi. Install MetaMask dulu!");
          return;
        }
        await window.ethereum.request({ method: "eth_requestAccounts" });
        await switchToMonad();

        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

        $("account").textContent = "Terhubung: " + short(userAddress);
        $("connectBtn").textContent = "Terhubung ✅";
        $("clickBtn").disabled = false;
        await refresh();

        // update otomatis tiap 5 detik supaya klik pemain lain terlihat
        setInterval(refresh, 5000);
      } catch (e) {
        $("status").textContent = "Gagal connect: " + (e.shortMessage || e.message);
      }
    }

    async function refresh() {
      try {
        const [mine, total, topP, topS] = await Promise.all([
          contract.score(userAddress),
          contract.totalClicks(),
          contract.topPlayer(),
          contract.topScore()
        ]);
        $("myScore").textContent = mine.toString();
        $("total").textContent = total.toString();
        $("top").textContent = topS > 0n ? `${short(topP)} (${topS})` : "-";
      } catch (e) {
        console.error(e);
      }
    }

    async function doClick() {
      try {
        $("clickBtn").disabled = true;
        $("status").textContent = "Konfirmasi transaksi di wallet...";
        const tx = await contract.click();
        $("status").innerHTML =
          `Menunggu konfirmasi... <a href="https://testnet.monadvision.com/tx/${tx.hash}" target="_blank">lihat transaksi</a>`;
        await tx.wait();
        $("status").textContent = "Berhasil! ✅";
        await refresh();
      } catch (e) {
        $("status").textContent = "Gagal: " + (e.shortMessage || e.message);
      } finally {
        $("clickBtn").disabled = false;
      }
    }

    $("connectBtn").onclick = connect;
    $("clickBtn").onclick = doClick;
  </script>
</body>
</html>
